<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kontakt – Monte.biuro rachunkowe</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
</head>
<body>
  <header class="site-header">
    <div class="container">
      <a href="index.html" class="logo">Monte.biuro rachunkowe</a>
      <nav>
        <a href="index.html">Strona główna</a>
        <a href="uslugi.html">Usługi</a>
        <a href="kontakt.html">Kontakt</a>
      </nav>
      <a href="kontakt.html" class="cta">Kontakt</a>
    </div>
  </header>
  <main>
    <section class="section">
      <div class="container">
        <h1>Kontakt</h1>
        <p>[Adres – do uzupełnienia]</p>
        <p>[E-mail – do uzupełnienia]</p>
        <p>[Telefon – do uzupełnienia]</p>
        <h2>Formularz kontaktowy</h2>
        <form class="contact-form" action="#" method="post">
          <p>
            <label for="name">Imię i nazwisko / Firma</label><br>
            <input type="text" id="name" name="name" required>
          </p>
          <p>
            <label for="email">E-mail</label><br>
            <input type="email" id="email" name="email" required>
          </p>
          <p>
            <label for="message">Wiadomość</label><br>
            <textarea id="message" name="message" rows="5" required></textarea>
          </p>
          <p>
            <button type="submit" class="btn">Wyślij</button>
          </p>
        </form>
      </div>
    </section>
  </main>
  <footer class="site-footer">
    <div class="container">
      <p>Monte.biuro rachunkowe</p>
      <p>[Adres, e-mail, telefon – do uzupełnienia]</p>
      <nav>
        <a href="index.html">Strona główna</a>
        <a href="uslugi.html">Usługi</a>
        <a href="kontakt.html">Kontakt</a>
        <a href="#">Polityka prywatności</a>
      </nav>
    </div>
  </footer>
  <script src="js/cookie-consent.js"></script>
</body>
</html>
